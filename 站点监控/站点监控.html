<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGHY Uptime Console</title>
  <link rel="icon" type="image/x-icon" href="../icons/dh.ico">
  <style>
    :root{--bg:#0b0f14;--top:#151b22;--side:#121820;--card:#141b23;--card-2:#18212b;--line:#27333f;--ink:#e8eef3;--muted:#91a0ad;--green:#55df91;--green-d:#1f9955;--red:#f45563;--amber:#f5bd52;--blue:#62a7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-rows:54px 1fr}.topbar{display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--top);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;font-weight:800}.brand-mark{display:grid;place-items:center;width:27px;height:27px;background:radial-gradient(circle at 50% 45%,#d5ffdf 0 23%,#61db90 25% 55%,#316f4a 58%);border:3px solid #9aacb8;border-radius:50%;box-shadow:0 0 0 2px #27333f}.brand span{font-size:17px}.top-nav{display:flex;gap:7px;margin-left:auto}.top-nav button{padding:7px 10px;color:#b6c3ce;background:transparent;border:0;border-radius:18px;cursor:pointer;font-size:12px}.top-nav button.active{color:#0c1510;background:var(--green);font-weight:800}.layout{display:grid;grid-template-columns:335px minmax(0,1fr);min-height:0}.sidebar{padding:14px;background:var(--side);border-right:1px solid var(--line);overflow:auto}.add-btn{width:100%;padding:9px 12px;color:#07130c;background:var(--green);border:0;border-radius:18px;cursor:pointer;text-align:left;font-weight:800}.side-tools{display:flex;gap:8px;align-items:center;margin:12px 0}.search{width:100%;padding:9px 11px;color:#dce6ee;background:#0a1016;border:1px solid var(--line);border-radius:4px;outline:none}.search:focus{border-color:#5c7488}.refresh{padding:8px;color:#d3e1eb;background:#1c2731;border:1px solid #324251;border-radius:4px;cursor:pointer}.monitor-list{display:grid;gap:4px}.monitor-row{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:center;padding:9px;border-radius:4px;cursor:pointer;border:1px solid transparent}.monitor-row:hover,.monitor-row.selected{background:#1a232d;border-color:#2b3a47}.percent{padding:3px 4px;text-align:center;color:#09140d;background:var(--green);border-radius:10px;font:800 10px/1.1 "Cascadia Mono",Consolas,monospace}.percent.down{color:#fff;background:var(--red)}.percent.wait{color:#19202a;background:var(--amber)}.monitor-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}.monitor-type{margin-left:5px;color:#81a7c1;font:10px "Cascadia Mono",Consolas,monospace}.heartbeats{display:flex;gap:3px;margin-top:6px;height:13px}.beat{width:4px;min-width:4px;flex:1;border-radius:2px;background:#495660}.beat.up{background:var(--green)}.beat.down{background:var(--red)}.beat.wait{background:var(--amber)}.side-note{margin-top:14px;padding:10px;color:#8ea0ae;border-top:1px solid var(--line);font-size:11px;line-height:1.55}.main{padding:22px;overflow:auto}.monitor-title{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.monitor-title h1{margin:0;font-size:25px;letter-spacing:-.03em}.monitor-url{display:inline-block;margin-top:7px;color:var(--green);font:12px "Cascadia Mono",Consolas,monospace;text-decoration:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{padding:8px 11px;color:#cad8e1;background:#202a34;border:1px solid #2e3d4a;border-radius:4px;cursor:pointer;font-size:12px;font-weight:700}.action.danger{color:#fff;background:#cf3f4b;border-color:#cf3f4b}.action.pause{color:#d3e5f2}.status-card{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-top:22px;padding:21px;background:var(--card);border:1px solid #202c36;border-radius:7px}.big-heartbeats{display:flex;gap:5px;height:27px;align-items:stretch}.big-heartbeats .beat{max-width:10px;border-radius:3px}.interval-note{margin-top:12px;color:var(--muted);font-size:12px}.status-badge{padding:11px 20px;color:#09140d;background:var(--green);border-radius:24px;font-size:18px;font-weight:900}.status-badge.down{color:#fff;background:var(--red)}.status-badge.wait{color:#1d2731;background:var(--amber)}.metrics{display:grid;grid-template-columns:repeat(5,1fr);margin-top:16px;background:var(--card);border:1px solid #202c36;border-radius:7px;overflow:hidden}.metric{padding:18px;text-align:center;border-right:1px solid #293540}.metric:last-child{border-right:0}.metric b{display:block;color:#dfeaf1;font:18px "Cascadia Mono",Consolas,monospace}.metric small{display:block;margin-top:7px;color:#8ea0ae;font-size:11px}.chart-card{margin-top:16px;padding:18px;background:var(--card);border:1px solid #202c36;border-radius:7px}.chart-head{display:flex;justify-content:space-between;color:#cbd8e1;font-size:13px;font-weight:700}.chart-head small{color:#8799a8;font-weight:400}canvas{width:100%;height:280px;margin-top:10px;background:#0f151b;border:1px solid #202c36;border-radius:4px}.empty{padding:55px;color:#8b9ba8;text-align:center}.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.68);backdrop-filter:blur(5px)}.modal.show{display:flex}.modal-box{width:min(470px,100%);padding:22px;background:#18212b;border:1px solid #3a4a57;border-radius:6px;box-shadow:0 24px 56px rgba(0,0,0,.5)}.modal-box h2{margin:0;font-size:21px}.modal-box p{color:#9aabb8;font-size:12px;line-height:1.55}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid label{display:grid;gap:6px;color:#c9d5de;font-size:12px;font-weight:700}.form-grid label.full{grid-column:1/-1}.form-grid input,.form-grid select{padding:10px;color:#e7eff4;background:#0c1218;border:1px solid #354755;border-radius:3px;outline:0}.form-grid input:focus,.form-grid select:focus{border-color:var(--green)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}@media(max-width:900px){.layout{grid-template-columns:270px minmax(0,1fr)}.metrics{grid-template-columns:repeat(3,1fr)}.metric:nth-child(3){border-right:0}.metric:nth-child(-n+3){border-bottom:1px solid #293540}}@media(max-width:680px){.top-nav{display:none}.layout{grid-template-columns:1fr}.sidebar{max-height:355px;border-right:0;border-bottom:1px solid var(--line)}.main{padding:16px}.metrics{grid-template-columns:1fr 1fr}.metric{border-right:0;border-bottom:1px solid #293540}.status-card{grid-template-columns:1fr}.status-badge{justify-self:start}.form-grid{grid-template-columns:1fr}.form-grid label.full{grid-column:auto}canvas{height:220px}}
.monitor-host{display:block;max-width:220px;margin-top:3px;overflow:hidden;color:#89a9bd;font:10px "Cascadia Mono",Consolas,monospace;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
  <div class="app"><header class="topbar"><div class="brand"><i class="brand-mark"></i><span>MGHY Uptime Console</span></div><nav class="top-nav"><button>状态页</button><button class="active">仪表盘</button><button id="settingsBtn">设置</button></nav></header><div class="layout"><aside class="sidebar"><button class="add-btn" id="addBtn">＋ 添加新监控</button><div class="side-tools"><input class="search" id="search" placeholder="搜索监控…"><button class="refresh" id="refreshBtn" title="立即检测">⟳</button></div><div class="monitor-list" id="monitorList"></div><p class="side-note">HTTP / HTTPS 直连监控<br>间隔：页面打开时每 60 秒刷新<br>历史记录仅保存在本机浏览器</p></aside><main class="main" id="detail"></main></div></div>
  <div class="modal" id="modal"><form class="modal-box" id="monitorForm"><h2>添加 HTTP(s) 监控</h2><p>静态页面会从当前浏览器直接请求站点；若此页通过 HTTPS 打开，浏览器会拦截 HTTP 混合内容请求。</p><div class="form-grid"><label>名称<input id="nameInput" required maxlength="40" placeholder="例如：新服务"></label><label>类型<select id="typeInput"><option value="https">HTTPS</option><option value="http">HTTP</option></select></label><label class="full">主机或完整地址<input id="urlInput" required maxlength="300" placeholder="new.mghy.top 或 https://new.mghy.top"></label></div><div class="modal-actions"><button class="action" id="cancelBtn" type="button">取消</button><button class="action" type="submit">加入监控</button></div></form></div>
  <script>
    const STORE='mghyUptimeMonitors',INTERVAL=60000;
    const defaults=[['主站','https','mghy.top'],['WWW','https','www.mghy.top'],['AI 服务','https','ai.mghy.top'],['文档库','https','docs.mghy.top'],['个人主页','https','zy.mghy.top'],['图床','https','tu.mghy.top']];
    let monitors=load(),selected=0,timer=null;
    function load(){try{const saved=JSON.parse(localStorage.getItem(STORE)||'[]');return [...defaults.map(([name,type,host])=>({id:`default-${host}`,name,type,url:`${type}://${host}`,default:true,history:[]})),...saved.map(item=>({...item,history:item.history||[]}))]}catch{return defaults.map(([name,type,host])=>({id:`default-${host}`,name,type,url:`${type}://${host}`,default:true,history:[]}))}}
    function save(){localStorage.setItem(STORE,JSON.stringify(monitors.filter(item=>!item.default).map(item=>({...item,history:item.history.slice(-30)}))))}
    const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function latest(m){return m.history.at(-1)}function percent(m){const h=m.history.slice(-20);return h.length?Math.round(h.filter(x=>x.ok).length/h.length*100):null}function typeClass(m){const last=latest(m);return !last?'wait':last.ok?'up':'down'}
    function renderList(){const q=document.getElementById('search').value.toLowerCase();const list=document.getElementById('monitorList');list.innerHTML='';monitors.forEach((m,i)=>{if(!`${m.name} ${m.url}`.toLowerCase().includes(q))return;const p=percent(m),status=typeClass(m),history=m.history.slice(-20);const row=document.createElement('article');row.className=`monitor-row ${i===selected?'selected':''}`;row.innerHTML=`<span class="percent ${status==='down'?'down':status==='wait'?'wait':''}">${p===null?'--':p+'%'}</span><div><div class="monitor-name">${esc(m.name)}<small class="monitor-type">${m.type.toUpperCase()}</small></div><span class="monitor-host">${esc(m.url.replace(/^https?:\/\//i,''))}</span><div class="heartbeats">${Array.from({length:20},(_,n)=>`<i class="beat ${history[n]?history[n].ok?'up':'down':'wait'}"></i>`).join('')}</div></div>`;row.onclick=()=>{selected=i;render()};list.appendChild(row)})}
    function render(){if(!monitors.length){document.getElementById('detail').innerHTML='<div class="empty">暂无监控项目</div>';return}selected=Math.min(selected,monitors.length-1);const m=monitors[selected],last=latest(m),status=typeClass(m),history=m.history.slice(-30),p=percent(m),avg=history.filter(x=>x.ms).length?Math.round(history.filter(x=>x.ms).reduce((a,b)=>a+b.ms,0)/history.filter(x=>x.ms).length):null;document.getElementById('detail').innerHTML=`<section class="monitor-title"><div><h1>${esc(m.name)}</h1><a class="monitor-url" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url)}</a></div><div class="actions"><button class="action pause" id="pauseBtn">${m.paused?'▶ 恢复':'Ⅱ 暂停'}</button>${m.default?'':`<button class="action danger" id="deleteBtn">删除</button>`}</div></section><section class="status-card"><div><div class="big-heartbeats">${Array.from({length:30},(_,n)=>`<i class="beat ${history[n]?history[n].ok?'up':'down':'wait'}"></i>`).join('')}</div><div class="interval-note">每 60 秒检测一次 · ${m.paused?'已暂停':'浏览器监控中'}</div></div><div class="status-badge ${status==='down'?'down':status==='wait'?'wait':''}">${m.paused?'Paused':last?last.ok?'Up':'Down':'Waiting'}</div></section><section class="metrics"><div class="metric"><b>${last&&last.ms?last.ms+' ms':'--'}</b><small>响应（当前）</small></div><div class="metric"><b>${avg?avg+' ms':'--'}</b><small>平均响应（本机历史）</small></div><div class="metric"><b>${p===null?'--':p+'%'}</b><small>可用率（最近 20 次）</small></div><div class="metric"><b>${history.length}</b><small>已记录心跳</small></div><div class="metric"><b>${m.type.toUpperCase()}</b><small>监控协议</small></div></section><section class="chart-card"><div class="chart-head"><span>响应时间趋势</span><small>本机会话历史 · 仅页面开启时更新</small></div><canvas id="chart"></canvas></section>`;document.getElementById('pauseBtn').onclick=()=>{m.paused=!m.paused;render();renderList()};const del=document.getElementById('deleteBtn');if(del)del.onclick=()=>{if(confirm('删除此监控吗？')){monitors.splice(selected,1);selected=0;save();render()}};renderList();drawChart(history)}
    function drawChart(history){const canvas=document.getElementById('chart');if(!canvas)return;const r=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=r.width*dpr;canvas.height=r.height*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);const w=r.width,h=r.height,p=32;c.strokeStyle='#25333e';c.lineWidth=1;for(let i=0;i<5;i++){const y=p+i*(h-p*2)/4;c.beginPath();c.moveTo(p,y);c.lineTo(w-p,y);c.stroke()}const points=history.filter(x=>x.ms);if(!points.length){c.fillStyle='#778a9a';c.font='12px sans-serif';c.fillText('等待首个响应数据…',p,h/2);return}const max=Math.max(300,...points.map(x=>x.ms))*1.15;c.strokeStyle='#55df91';c.fillStyle='rgba(85,223,145,.14)';c.lineWidth=2;c.beginPath();points.forEach((point,i)=>{const x=p+i*(w-p*2)/Math.max(1,points.length-1),y=h-p-(point.ms/max)*(h-p*2);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.lineTo(w-p,h-p);c.lineTo(p,h-p);c.closePath();c.fill();c.fillStyle='#8fa1af';c.font='10px monospace';c.fillText(`${Math.round(max)} ms`,4,p+4);c.fillText('0 ms',4,h-p)}
    async function check(m){if(m.paused)return;const started=performance.now();let ok=false,msg='无法连接';if(m.type==='http'&&location.protocol==='https:'){msg='HTTPS 页面阻止 HTTP 混合内容'}else{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);try{await fetch(`${m.url.replace(/\/$/,'')}/?uptime=${Date.now()}`,{mode:'no-cors',cache:'no-store',signal:controller.signal});ok=true;msg='可连接'}catch(e){msg=e.name==='AbortError'?'连接超时':'无法连接'}finally{clearTimeout(timeout)}}m.history.push({ok,ms:ok?Math.round(performance.now()-started):null,at:Date.now(),msg});m.history=m.history.slice(-30)}
    async function checkAll(){document.getElementById('refreshBtn').textContent='…';await Promise.all(monitors.map(check));document.getElementById('refreshBtn').textContent='⟳';render();save()}function startTimer(){clearInterval(timer);timer=setInterval(checkAll,INTERVAL)}
    document.getElementById('refreshBtn').onclick=checkAll;document.getElementById('search').oninput=renderList;document.getElementById('addBtn').onclick=()=>{document.getElementById('modal').classList.add('show');document.getElementById('nameInput').focus()};document.getElementById('cancelBtn').onclick=()=>{document.getElementById('modal').classList.remove('show');document.getElementById('monitorForm').reset()};document.getElementById('monitorForm').onsubmit=e=>{e.preventDefault();const type=document.getElementById('typeInput').value,raw=document.getElementById('urlInput').value.trim(),url=/^https?:\/\//i.test(raw)?raw:`${type}://${raw}`;if(!new RegExp(`^${type}://`,'i').test(url)){alert(`请选择 ${type.toUpperCase()} 或填写相同协议的地址。`);return}if(monitors.some(m=>m.url===url)){alert('该地址已在监控中。');return}monitors.push({id:`custom-${Date.now()}`,name:document.getElementById('nameInput').value.trim(),type,url,history:[]});selected=monitors.length-1;document.getElementById('cancelBtn').click();save();render();checkAll()};window.addEventListener('resize',()=>drawChart(monitors[selected]?.history||[]));render();startTimer();checkAll();
  </script>
</body>
</html>
